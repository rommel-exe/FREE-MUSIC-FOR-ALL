appId: com.freemusicplayer.app
productName: Free Music Player
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
extraResources:
  - from: resources/
    to: resources/
publish:
  provider: github
  owner: rommel-exe
  repo: FREE-MUSIC-FOR-ALL
  releaseType: release
  # If you fork or move to a different repo, update owner/repo above.
  # Set GH_TOKEN env var when building for publish: GH_TOKEN=xxx npm run electron:build
mac:
  category: public.app-category.music
  identity: "-"                   # Ad-hoc sign (no Apple cert needed)
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - dmg
    - zip
win:
  # Supply resources/icons/icon.ico for a custom Windows icon
  target:
    - nsis
    - portable
linux:
  # Supply PNGs in resources/icons/ for a custom Linux icon
  target:
    - AppImage
    - deb
  category: Audio
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
