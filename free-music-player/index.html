    <title>Free Music Player</title>
    <style>
      /* System font stack — SF Pro via system fonts on macOS, Inter fallback */
      @font-face { font-family: 'SF Pro'; font-weight: 400; src: local('SF Pro Text'), local('SF-Pro-Text-Regular'); }
      @font-face { font-family: 'SF Pro'; font-weight: 500; src: local('SF Pro Text Medium'), local('SF-Pro-Text-Medium'); }
      @font-face { font-family: 'SF Pro'; font-weight: 600; src: local('SF Pro Text Semibold'), local('SF-Pro-Text-Semibold'); }
      @font-face { font-family: 'SF Pro'; font-weight: 700; src: local('SF Pro Display Bold'), local('SF-Pro-Display-Bold'); }
      @font-face { font-family: 'SF Pro Rounded'; font-weight: 500; src: local('SF Pro Rounded Medium'), local('SF-Pro-Rounded-Medium'); }
      @font-face { font-family: 'SF Mono'; font-weight: 400; src: local('SF Mono'), local('SF-Mono-Regular'); }
      @font-face { font-family: 'SF Mono'; font-weight: 600; src: local('SF Mono Semibold'), local('SF-Mono-Semibold'); }
    </style>
  </head>
