# ────────────────────────────────────────────────────────────────────────────
#  Free Music Player — CI/CD Pipeline
#
#  Triggers:
#    - Push to 'main'         → build & lint (no publish)
#    - Tag push 'v*'          → build + publish to GitHub Releases
#
#  Secrets required for publishing:
#    GH_TOKEN          — GitHub PAT with `repo` scope (or use GITHUB_TOKEN)
#    (macOS signing)   — CSC_LINK + CSC_KEY_PASSWORD for code signing
#    (macOS notarize)  — APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
# ────────────────────────────────────────────────────────────────────────────

name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

defaults:
  run:
    working-directory: free-music-player

jobs:
  # ─── Lint & Type-check ──────────────────────────────────────────────────
  check:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: free-music-player/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check renderer
        run: npx tsc --noEmit

      - name: Type-check electron
        run: npx tsc --noEmit -p electron/tsconfig.json

  # ─── Build (all platforms, no publish) ─────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: free-music-player/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile Electron main process
        run: npx tsc -p electron/tsconfig.json

      - name: Build renderer (Vite)
        run: npx vite build

      - name: Package with electron-builder
        run: npx electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: free-music-player/release/
          retention-days: 7

  # ─── Publish (tag push → GitHub Releases) ─────────────────────────────
  publish:
    name: Publish (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      # Continue with other OS builds even if one fails
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: free-music-player/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile Electron main process
        run: npx tsc -p electron/tsconfig.json

      - name: Build renderer (Vite)
        run: npx vite build

      - name: Package & publish to GitHub Releases
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing — optional, uncomment if you have certs:
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.os }}
          path: free-music-player/release/
          retention-days: 90

  # ─── Create GitHub Release (macOS only — publishes notes + points to artifacts) ─
  release:
    name: Create Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        id: body
        run: |
          cat << EOF > RELEASE_BODY.md
          ## Free Music Player ${{ steps.notes.outputs.version }}

          ### Installation
          - **macOS**: Download \`.dmg\` or \`.zip\` from the artifacts above.
          - **Windows**: Download \`.exe\` (NSIS installer) or \`.exe\` (portable).
          - **Linux**: Download \`.AppImage\` or \`.deb\`.

          > Once installed, the app will auto-update from this release feed.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: v${{ steps.notes.outputs.version }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
